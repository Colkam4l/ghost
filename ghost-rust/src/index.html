<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GHOST — AI Interview Copilot (Rust)</title>
  <!-- Markdown & Syntax Highlighting -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
  <!-- Supabase Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #080a0e;
      --bg2: #0d1117;
      --neon: #00ff88;
      --cyan: #00c8ff;
      --red: #ff3366;
      --orange: #ff9f43;
      --dim: #3a4553;
      --text: #c9d1d9;
      --text-bright: #e6edf3;
      --border: #1a2233;
      --glass: rgba(13, 17, 23, 0.85);
      --radius: 8px;
      --font-mono: 'Consolas', 'Courier New', monospace;
      --font-ui: 'Segoe UI', 'Arial', sans-serif;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      background: transparent;
      font-family: var(--font-mono);
      color: var(--text);
      overflow: hidden;
      user-select: none;
    }

    #app-root {
      width: 100%;
      height: 100%;
      background: var(--bg);
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
      border: 1px solid var(--border);
    }

    #app-root::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(0, 255, 136, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 255, 136, 0.03) 1px, transparent 1px);
      background-size: 24px 24px;
      pointer-events: none;
      z-index: 0;
    }

    #app-root::after {
      content: '';
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(0deg, transparent 0px, transparent 3px, rgba(0, 0, 0, 0.04) 3px, rgba(0, 0, 0, 0.04) 6px);
      pointer-events: none;
      z-index: 9999;
    }

    /* ─── TITLEBAR ─── */
    #titlebar {
      height: 36px;
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px;
      position: relative;
      z-index: 10;
      flex-shrink: 0;
    }

    #titlebar .left {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    #titlebar .logo {
      font-size: 14px;
    }

    #titlebar .title {
      font-family: var(--font-ui);
      font-weight: 800;
      font-size: 11px;
      color: var(--neon);
      letter-spacing: 1.5px;
    }

    .stealth-badge {
      font-size: 7px;
      font-weight: 700;
      color: var(--bg);
      background: var(--neon);
      padding: 2px 5px;
      border-radius: 3px;
      animation: blink 1.4s ease-in-out infinite;
    }

    @keyframes blink {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0.3;
      }
    }

    .header-info {
      font-size: 8px;
      color: var(--dim);
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .prot-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--neon);
      box-shadow: 0 0 4px var(--neon);
      transition: all 0.3s;
    }

    .prot-dot.off {
      background: var(--red);
      box-shadow: 0 0 4px var(--red);
    }

    #titlebar .controls {
      display: flex;
      gap: 3px;
    }

    #titlebar .controls button {
      width: 24px;
      height: 24px;
      border: none;
      border-radius: 3px;
      background: rgba(255, 255, 255, 0.05);
      color: var(--dim);
      cursor: pointer;
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    #titlebar .controls button:hover {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-bright);
    }

    #titlebar .controls .close-btn:hover {
      background: var(--red);
      color: #fff;
    }

    /* ─── COMPACT TOOLBAR ─── */
    #toolbar {
      display: flex;
      align-items: center;
      gap: 2px;
      padding: 3px 8px;
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      z-index: 10;
      position: relative;
    }

    .tb-btn {
      width: 28px;
      height: 26px;
      border: none;
      border-radius: 4px;
      background: transparent;
      color: var(--dim);
      cursor: pointer;
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      gap: 2px;
    }

    .tb-btn:hover {
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-bright);
    }

    .tb-btn.tb-danger:hover {
      color: var(--red);
    }

    .tb-btn.live-active {
      background: rgba(255, 51, 102, 0.1);
      color: var(--red);
    }

    .tb-btn.voice-active {
      background: rgba(255, 51, 102, 0.1);
      color: var(--red);
    }

    .tb-sep {
      width: 1px;
      height: 16px;
      background: var(--border);
      margin: 0 3px;
      flex-shrink: 0;
    }

    #toolbar .mode-btn {
      width: 26px;
      height: 24px;
      border: 1px solid transparent;
      border-radius: 4px;
      background: transparent;
      color: var(--dim);
      cursor: pointer;
      font-size: 11px;
      transition: all 0.2s;
    }

    #toolbar .mode-btn:hover {
      border-color: var(--cyan);
      color: var(--cyan);
    }

    #toolbar .mode-btn.active {
      border-color: var(--cyan);
      color: var(--cyan);
      background: rgba(0, 200, 255, 0.08);
    }

    .tb-lang {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 3px;
      padding: 3px 4px;
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 8px;
      outline: none;
      cursor: pointer;
      -webkit-appearance: none;
      appearance: none;
    }

    .tb-lang option {
      background: var(--bg2);
    }

    #toolbar .model-toggle {
      display: flex;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border);
      border-radius: 3px;
      overflow: hidden;
    }

    #toolbar .model-toggle button {
      font-size: 10px;
      padding: 3px 6px;
      border: none;
      background: transparent;
      color: var(--dim);
      cursor: pointer;
      transition: all 0.2s;
    }

    #toolbar .model-toggle button.active {
      background: var(--neon);
      color: var(--bg);
    }

    #toolbar .session-info {
      font-size: 8px;
      color: var(--dim);
      margin-right: 2px;
    }

    #toolbar .pulse-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--red);
      display: none;
      animation: pulse 1s ease-in-out infinite;
    }

    .tb-btn.live-active .pulse-dot,
    .tb-btn.voice-active .pulse-dot {
      display: inline-block;
    }

    /* ─── COLLAPSIBLE PANEL ─── */
    #controls-panel {
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: max-height 0.25s ease, padding 0.25s ease, opacity 0.2s ease;
      max-height: 200px;
      overflow: hidden;
      flex-shrink: 0;
      z-index: 9;
    }

    #controls-panel.collapsed {
      max-height: 0;
      padding: 0 10px;
      opacity: 0;
      border-bottom: none;
    }

    .panel-section {
      display: block;
    }

    .panel-label {
      font-size: 7px;
      font-weight: 700;
      color: var(--cyan);
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 4px;
      display: block;
    }

    #controls-panel .api-row {
      display: flex;
      gap: 4px;
    }

    #controls-panel .api-row input {
      flex: 1;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--border);
      border-radius: 3px;
      padding: 5px 7px;
      color: var(--neon);
      font-family: var(--font-mono);
      font-size: 10px;
      outline: none;
    }

    #controls-panel .api-row input:focus {
      border-color: var(--neon);
    }

    #controls-panel .api-row input::placeholder {
      color: var(--dim);
    }

    #controls-panel .clear-btn {
      font-size: 9px;
      padding: 3px 6px;
      border: 1px solid var(--border);
      border-radius: 3px;
      background: transparent;
      color: var(--dim);
      cursor: pointer;
    }

    #controls-panel .clear-btn:hover {
      border-color: var(--red);
      color: var(--red);
    }

    /* ─── OVERLAYS ─── */
    .live-feed,
    .screenshot-preview,
    .transcript-area,
    .error-msg {
      margin: 0 8px;
      flex-shrink: 0;
    }

    .live-feed {
      display: none;
      border: 1px solid var(--border);
      border-radius: 4px;
      overflow: hidden;
      position: relative;
      height: 70px;
      margin-top: 4px;
    }

    .live-feed.show {
      display: block;
    }

    .live-feed img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.6;
    }

    .live-feed .feed-overlay {
      position: absolute;
      top: 3px;
      left: 5px;
      display: flex;
      gap: 4px;
      align-items: center;
    }

    .live-feed .feed-label {
      font-size: 7px;
      color: var(--red);
      background: rgba(0, 0, 0, 0.8);
      padding: 1px 4px;
      border-radius: 3px;
      display: flex;
      align-items: center;
      gap: 3px;
    }

    .live-feed .feed-label .dot {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--red);
      animation: pulse 1s ease-in-out infinite;
    }

    .live-feed .analyze-btn {
      font-family: var(--font-mono);
      font-size: 7px;
      padding: 1px 5px;
      border: 1px solid var(--orange);
      border-radius: 3px;
      background: rgba(0, 0, 0, 0.8);
      color: var(--orange);
      cursor: pointer;
    }

    .screenshot-preview {
      display: none;
      border: 1px solid var(--border);
      border-radius: 4px;
      overflow: hidden;
      position: relative;
      max-height: 70px;
      margin-top: 4px;
    }

    .screenshot-preview.show {
      display: block;
    }

    .screenshot-preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.7;
    }

    .screenshot-preview .overlay-label {
      position: absolute;
      top: 3px;
      left: 5px;
      font-size: 7px;
      color: var(--orange);
      background: rgba(0, 0, 0, 0.7);
      padding: 1px 4px;
      border-radius: 3px;
    }

    .screenshot-preview .dismiss-btn {
      position: absolute;
      top: 3px;
      right: 5px;
      font-size: 9px;
      color: var(--dim);
      background: rgba(0, 0, 0, 0.7);
      border: none;
      padding: 1px 4px;
      border-radius: 3px;
      cursor: pointer;
    }

    .transcript-area {
      display: none;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 6px 8px;
      font-size: 9px;
      color: var(--text);
      max-height: 60px;
      overflow-y: auto;
      margin-top: 4px;
    }

    .transcript-area.show {
      display: block;
    }

    .transcript-label {
      font-size: 6px;
      color: var(--red);
      letter-spacing: 1px;
      margin-bottom: 2px;
      display: flex;
      align-items: center;
      gap: 3px;
    }

    .transcript-label .live-dot {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--red);
      animation: pulse 1s ease-in-out infinite;
    }

    .error-msg {
      color: var(--red);
      font-size: 9px;
      padding: 5px 8px;
      border: 1px solid rgba(255, 51, 102, 0.3);
      border-radius: 4px;
      background: rgba(255, 51, 102, 0.05);
      display: none;
      margin-top: 4px;
    }

    .error-msg.show {
      display: block;
    }

    #output {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
      position: relative;
      z-index: 1;
      user-select: text;
      -webkit-user-select: text;
    }

    #output::-webkit-scrollbar {
      width: 4px;
    }

    #output::-webkit-scrollbar-track {
      background: transparent;
    }

    #output::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 3px;
    }

    #think-container {
      flex-shrink: 0;
      padding: 0 8px;
    }

    #input-bar {
      display: flex;
      align-items: flex-end;
      gap: 6px;
      padding: 6px 8px;
      background: var(--bg2);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
      z-index: 10;
      position: relative;
    }

    #input-bar textarea {
      flex: 1;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 7px 10px;
      color: var(--text-bright);
      font-family: var(--font-mono);
      font-size: 10px;
      line-height: 1.4;
      resize: none;
      outline: none;
      min-height: 32px;
      max-height: 100px;
      overflow-y: auto;
    }

    #input-bar textarea:focus {
      border-color: var(--cyan);
    }

    #input-bar textarea::placeholder {
      color: var(--dim);
    }

    #input-bar .char-count {
      position: absolute;
      right: 52px;
      bottom: 12px;
      font-size: 7px;
      color: var(--dim);
    }

    #input-bar .run-btn {
      width: 34px;
      height: 34px;
      border: none;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--neon), var(--cyan));
      color: var(--bg);
      cursor: pointer;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.25s;
      flex-shrink: 0;
    }

    #input-bar .run-btn:hover {
      box-shadow: 0 0 16px rgba(0, 255, 136, 0.3);
      transform: scale(1.05);
    }

    #input-bar .run-btn:active {
      transform: scale(0.95);
    }

    .chat-msg {
      margin-bottom: 8px;
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 10px;
      line-height: 1.6;
      word-break: break-word;
      position: relative;
    }

    .chat-msg.user {
      background: rgba(0, 200, 255, 0.08);
      border: 1px solid rgba(0, 200, 255, 0.15);
      border-left: 3px solid var(--cyan);
      color: var(--cyan);
      white-space: pre-wrap;
    }

    .chat-msg.assistant {
      background: rgba(0, 255, 136, 0.04);
      border: 1px solid rgba(0, 255, 136, 0.1);
      border-left: 3px solid var(--neon);
      color: var(--text-bright);
    }

    .chat-msg.assistant p {
      margin-bottom: 8px;
    }

    .chat-msg.assistant p:last-child {
      margin-bottom: 0;
    }

    .chat-msg.assistant ul,
    .chat-msg.assistant ol {
      margin-bottom: 8px;
      padding-left: 16px;
    }

    .chat-msg.assistant li {
      margin-bottom: 4px;
    }

    .chat-msg.assistant strong {
      color: var(--text-bright);
      font-weight: 700;
    }

    .chat-msg.assistant h1,
    .chat-msg.assistant h2,
    .chat-msg.assistant h3,
    .chat-msg.assistant h4 {
      color: var(--cyan);
      margin: 12px 0 6px 0;
      font-size: 11px;
      font-weight: 700;
    }

    .chat-msg.assistant code {
      font-family: var(--font-mono);
      font-size: 9px;
      color: var(--neon);
      background: rgba(0, 255, 136, 0.08);
      padding: 1px 3px;
      border-radius: 3px;
    }

    /* Code Blocks */
    .code-block-wrapper {
      margin: 8px 0;
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
      background: rgba(0, 0, 0, 0.3);
    }

    .code-block-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 8px;
      background: rgba(255, 255, 255, 0.03);
      border-bottom: 1px solid var(--border);
    }

    .code-block-lang {
      font-size: 7px;
      font-weight: 700;
      color: var(--cyan);
      letter-spacing: 0.5px;
    }

    .code-block-copy {
      font-family: var(--font-mono);
      font-size: 7px;
      padding: 1px 5px;
      border: 1px solid var(--border);
      border-radius: 3px;
      background: rgba(0, 0, 0, 0.4);
      color: var(--dim);
      cursor: pointer;
      transition: all 0.2s;
    }

    .code-block-copy:hover {
      border-color: var(--cyan);
      color: var(--cyan);
    }

    .code-block-copy.copied {
      border-color: var(--neon);
      color: var(--neon);
    }

    .code-block-wrapper pre {
      margin: 0;
      padding: 8px;
      overflow-x: auto;
    }

    .code-block-wrapper pre code {
      background: transparent !important;
      padding: 0 !important;
      font-size: 9px;
      color: var(--text-bright);
      display: block;
    }

    .chat-msg .msg-label {
      font-size: 7px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 4px;
      opacity: 0.6;
    }

    .chat-msg.user .msg-label {
      color: var(--cyan);
    }

    .chat-msg.assistant .msg-label {
      color: var(--neon);
    }

    .chat-msg .msg-copy {
      position: absolute;
      top: 4px;
      right: 6px;
      font-family: var(--font-mono);
      font-size: 7px;
      padding: 1px 5px;
      border: 1px solid var(--border);
      border-radius: 3px;
      background: rgba(0, 0, 0, 0.4);
      color: var(--dim);
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.2s;
    }

    .chat-msg:hover .msg-copy {
      opacity: 1;
    }

    .think-block {
      margin-top: 6px;
      border: 1px solid var(--border);
      border-radius: 4px;
    }

    .think-block summary {
      padding: 5px 8px;
      font-size: 8px;
      color: var(--dim);
      cursor: pointer;
      background: rgba(0, 0, 0, 0.3);
      font-family: var(--font-mono);
    }

    .think-block .think-content {
      padding: 8px;
      font-size: 9px;
      color: var(--dim);
      line-height: 1.5;
      white-space: pre-wrap;
      font-family: var(--font-mono);
    }

    .opacity-control {
      display: flex;
      align-items: center;
      gap: 4px;
      flex: 1;
    }

    .opacity-slider {
      flex: 1;
      -webkit-appearance: none;
      appearance: none;
      height: 2px;
      background: var(--border);
      border-radius: 2px;
      outline: none;
    }

    .opacity-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--neon);
      cursor: pointer;
    }

    .opacity-val {
      font-size: 8px;
      color: var(--neon);
      min-width: 24px;
      text-align: right;
    }

    .toggle-prot-btn {
      font-family: var(--font-mono);
      font-size: 7px;
      padding: 3px 7px;
      border: 1px solid var(--neon);
      border-radius: 3px;
      background: transparent;
      color: var(--neon);
      cursor: pointer;
      white-space: nowrap;
    }

    .toggle-prot-btn.off {
      border-color: var(--red);
      color: var(--red);
    }

    @keyframes pulse {
      0% {
        transform: scale(1);
        opacity: 1;
      }

      50% {
        transform: scale(1.5);
        opacity: 0.5;
      }

      100% {
        transform: scale(1);
        opacity: 1;
      }
    }

    .spinner {
      display: inline-block;
      width: 10px;
      height: 10px;
      border: 2px solid var(--bg);
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      vertical-align: middle;
      margin-right: 4px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* ─── AUTH SCREEN ─── */
    #auth-overlay {
      position: absolute;
      top: 36px;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(8, 10, 14, 0.9);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 20px;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }
    
    #auth-overlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    
    .auth-container {
      width: 320px;
      padding: 30px;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      box-shadow: 0 0 24px rgba(0, 255, 136, 0.05);
    }
    
    .auth-logo {
      font-size: 40px;
      margin-bottom: 12px;
      animation: float 3s ease-in-out infinite;
    }
    
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    
    .auth-title {
      font-family: var(--font-ui);
      font-weight: 800;
      font-size: 16px;
      color: var(--neon);
      letter-spacing: 2px;
      margin-bottom: 8px;
    }
    
    .auth-subtitle {
      font-size: 10px;
      color: var(--dim);
      margin-bottom: 24px;
      line-height: 1.5;
    }
    
    .auth-btn {
      width: 100%;
      height: 38px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.03);
      color: var(--text-bright);
      cursor: pointer;
      font-family: var(--font-mono);
      font-size: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.25s ease;
    }
    
    .auth-btn:hover {
      background: rgba(0, 255, 136, 0.06);
      border-color: var(--neon);
      color: var(--neon);
      box-shadow: 0 0 12px rgba(0, 255, 136, 0.15);
    }
    
    .auth-btn img {
      width: 14px;
      height: 14px;
    }
    
    .auth-status {
      font-size: 8px;
      color: var(--dim);
      margin-top: 16px;
    }

    .user-profile {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-right: 12px;
      font-size: 9px;
      color: var(--dim);
    }

    .user-avatar {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--bg);
      object-fit: cover;
    }

    /* ─── SIDEBAR & MULTI-CHAT ─── */
    #sidebar-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      z-index: 90;
      opacity: 0;
      visibility: hidden;
      transition: all 0.25s ease;
    }
    #sidebar-backdrop.show {
      opacity: 1;
      visibility: visible;
    }
    
    #sidebar {
      position: absolute;
      top: 36px;
      left: 0;
      width: 220px;
      height: calc(100% - 36px);
      background: rgba(8, 9, 12, 0.96);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-right: 1px solid var(--border);
      transform: translateX(-100%);
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 95;
      display: flex;
      flex-direction: column;
      padding: 12px;
      box-sizing: border-box;
    }
    #sidebar.open {
      transform: translateX(0);
    }
    
    .new-chat-btn {
      width: 100%;
      height: 32px;
      border: 1px dashed var(--neon);
      border-radius: 4px;
      background: rgba(0, 255, 136, 0.03);
      color: var(--neon);
      font-family: var(--font-mono);
      font-size: 9px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-bottom: 12px;
      transition: all 0.2s ease;
    }
    .new-chat-btn:hover {
      background: rgba(0, 255, 136, 0.08);
      box-shadow: 0 0 10px rgba(0, 255, 136, 0.2);
    }
    
    .session-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding-right: 2px;
    }
    
    .session-item {
      padding: 8px 10px;
      border-radius: 4px;
      border: 1px solid transparent;
      background: rgba(255, 255, 255, 0.01);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      transition: all 0.2s ease;
    }
    .session-item:hover {
      background: rgba(255, 255, 255, 0.03);
      border-color: var(--border);
    }
    .session-item.active {
      background: rgba(0, 255, 136, 0.04);
      border-color: var(--neon);
    }
    
    .session-info-left {
      display: flex;
      flex-direction: column;
      gap: 2px;
      overflow: hidden;
      flex: 1;
    }
    .session-title-text {
      font-size: 9px;
      color: var(--text-bright);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-align: left;
    }
    .session-item.active .session-title-text {
      color: var(--neon);
      font-weight: bold;
    }
    .session-date-text {
      font-size: 7px;
      color: var(--dim);
      text-align: left;
    }
    
    .session-delete-btn {
      width: 16px;
      height: 16px;
      border: none;
      background: transparent;
      color: var(--dim);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 3px;
      opacity: 0;
      transition: opacity 0.2s, background-color 0.2s, color 0.2s;
    }
    .session-item:hover .session-delete-btn {
      opacity: 1;
    }
    .session-delete-btn:hover {
      background: rgba(255, 68, 68, 0.15);
      color: var(--red);
    }
    
    /* ─── SCROLL TO BOTTOM BUTTON ─── */
    #scroll-bottom-btn {
      position: absolute;
      bottom: 50px;
      right: 20px;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--bg2);
      color: var(--neon);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
      z-index: 80;
      opacity: 0;
      visibility: hidden;
      transition: all 0.25s ease;
      font-size: 10px;
    }
    #scroll-bottom-btn.show {
      opacity: 1;
      visibility: visible;
    }
    #scroll-bottom-btn:hover {
      border-color: var(--neon);
      box-shadow: 0 0 10px rgba(0, 255, 136, 0.2);
    }
  </style>
</head>

<body>
  <div id="app-root">
    <!-- TITLEBAR -->
    <div id="titlebar">
      <div class="left">
        <span class="logo">👻</span>
        <span class="title">GHOST-RUST</span>
        <span class="stealth-badge">STEALTH</span>
      </div>
      <div class="header-info">
        <div id="user-profile-header" class="user-profile" style="display: none;">
          <img id="user-avatar-img" class="user-avatar" src="" />
          <span id="user-email-text"></span>
        </div>
        <span id="platform-label">—</span>
        <span>PROT</span>
        <span class="prot-dot" id="prot-dot"></span>
        <span id="prot-status-text">ON</span>
      </div>
      <div class="controls">
        <button id="btn-minimize" title="Minimize">─</button>
        <button class="close-btn" id="btn-close" title="Close">✕</button>
      </div>
    </div>

    <!-- AUTH OVERLAY -->
    <div id="auth-overlay">
      <div class="auth-container">
        <div class="auth-logo">👻</div>
        <div class="auth-title">GHOST-RUST</div>
        <div class="auth-subtitle">Sign in with Google to sync your chats and save your API settings across sessions.</div>
        <button class="auth-btn" id="btn-google-login">
          <svg style="width: 14px; height: 14px; vertical-align: middle;" viewBox="0 0 24 24">
            <path fill="#ffffff" d="M21.35,11.1H12v2.7h5.38c-0.24,1.28 -0.96,2.37 -2.04,3.1v2.58h3.3c1.93,-1.78 3.04,-4.4 3.04,-7.4C21.68,11.83 21.56,11.45 21.35,11.1z" />
            <path fill="#ea4335" d="M12,22c2.7,0 4.96,-0.9 6.62,-2.42l-3.3,-2.58c-0.9,0.6 -2.07,0.98 -3.32,0.98 -2.56,0 -4.72,-1.73 -5.5,-4.06l-3.41,2.64C3.12,18.77 7.22,22 12,22z" />
            <path fill="#fbbc05" d="M6.5,13.92c-0.2,-0.6 -0.31,-1.24 -0.31,-1.92s0.11,-1.32 0.31,-1.92L3.09,7.44C2.3,9.02 1.84,10.79 1.84,12.68c0,1.89 0.46,3.66 1.25,5.24L6.5,13.92z" />
            <path fill="#4285f4" d="M12,5.38c1.47,0 2.78,0.5 3.82,1.5l2.87,-2.87C16.96,2.44 14.7,1.5 12,1.5c-4.78,0 -8.88,3.23 -10.16,6.1l3.41,2.64C6.03,7.91 8.19,6.18 12,5.38z" />
          </svg>
          Sign in with Google
        </button>
        <button class="auth-btn" id="btn-work-offline" style="margin-top: 8px; border-color: var(--dim); color: var(--dim);">
          Work Offline (Local Storage Only)
        </button>
        <div class="auth-status" id="auth-status-text">Connecting to database...</div>
      </div>
    </div>

    <!-- SIDEBAR BLUR BACKDROP -->
    <div id="sidebar-backdrop"></div>

    <!-- SIDEBAR PANEL -->
    <div id="sidebar">
      <button class="new-chat-btn" id="btn-new-chat">
        <span>+</span> New Chat
      </button>
      <div class="session-list" id="session-list">
        <!-- Rendered dynamically -->
      </div>
    </div>

    <!-- COMPACT TOOLBAR -->
    <div id="toolbar">
      <button class="tb-btn" id="btn-sidebar-toggle" title="Toggle chats sidebar">☰</button>
      <div class="tb-sep"></div>
      <button class="tb-btn" id="tb-toggle" title="Toggle controls panel">⚙️</button>
      <div class="tb-sep"></div>
      <button class="mode-btn active" data-mode="explain" title="Explanation Mode">💡</button>
      <button class="mode-btn" data-mode="hints" title="Hints Mode">🔍</button>
      <button class="mode-btn" data-mode="solution" title="Solution Mode">⚙️</button>
      <div class="tb-sep"></div>
      <button class="tb-btn" id="capture-btn" title="Take Screenshot (Ctrl+Shift+C)">📸</button>
      <button class="tb-btn" id="live-btn" title="Live Monitor (Experimental)">🖥️</button>
      <button class="tb-btn voice-btn" id="voice-btn" title="Voice Input (Alt+Shift+V)">🎤</button>
      <div class="tb-sep"></div>
      <button class="tb-btn" id="lang-btn" title="Switch Language">PY</button>
      <div style="flex:1"></div>
      <span class="session-info" id="session-info">0</span>
      <button class="tb-btn tb-danger" id="clear-btn" title="Clear session">🗑️</button>
    </div>

    <div id="controls-panel" class="collapsed">
      <div class="panel-section">
        <label class="panel-label">🔑 AI API KEY</label>
        <div class="api-row">
          <input type="password" id="api-key" placeholder="Enter API Key..." />
          <button class="clear-btn" id="clear-key-btn">✕</button>
        </div>
      </div>
      <div class="panel-section">
        <label class="panel-label">🌐 BASE URL</label>
        <input type="text" id="api-url" placeholder="https://api.openai.com/v1" />
      </div>
      <div class="panel-section">
        <label class="panel-label">🤖 MODEL</label>
        <input type="text" id="api-model" placeholder="moonshotai/kimi-k2.5" />
      </div>
      <div class="panel-section" style="display:flex;gap:8px;align-items:center;">
        <label class="panel-label" style="margin-bottom:0;">🛡️ STEALTH</label>
        <div class="opacity-control">
          <input type="range" class="opacity-slider" id="opacity-slider" min="10" max="100" value="100" />
          <span class="opacity-val" id="opacity-val">100%</span>
        </div>
        <button class="toggle-prot-btn" id="toggle-prot-btn">🛡️ ON</button>
      </div>
      <div class="panel-section" style="margin-top: 4px; border-top: 1px solid var(--border); padding-top: 8px; display: flex; justify-content: space-between; align-items: center;">
        <span style="font-size: 8px; color: var(--dim);" id="account-status-label">Local Mode</span>
        <button id="btn-signout" class="toggle-prot-btn off" style="padding: 2px 6px;">🚪 Sign Out</button>
      </div>
    </div>

    <!-- OVERLAYS -->
    <div class="live-feed" id="live-feed">
      <span class="feed-overlay">
        <span class="feed-label"><span class="dot"></span> LIVE</span>
        <button class="analyze-btn" id="analyze-live-btn">⚡ ANALYZE</button>
      </span>
      <img id="live-img" src="" />
    </div>

    <div class="screenshot-preview" id="screenshot-preview">
      <span class="overlay-label">📸 Captured</span>
      <button class="dismiss-btn" id="dismiss-screenshot">✕</button>
      <img id="screenshot-img" src="" />
    </div>

    <div class="error-msg" id="error-msg"></div>

    <div id="output" style="position: relative;">
      <div id="chat-messages"></div>
      <button id="scroll-bottom-btn" title="Scroll to bottom">▼</button>
    </div>
    <div id="think-container"></div>

    <div id="input-bar">
      <textarea id="problem-input" placeholder="Ask GHOST..." rows="1"></textarea>
      <span class="char-count" id="char-count">0</span>
      <button class="run-btn" id="run-btn">▶</button>
    </div>
  </div>

  <script type="module">
    // --- TAURI API ---
    const { invoke } = window.__TAURI__.core;
    const { getCurrentWindow } = window.__TAURI__.window;
    const { listen } = window.__TAURI__.event;

    const appWindow = getCurrentWindow();

    // --- STATE ---
    // --- STATE ---
    // --- STATE ---
    let aiKey = localStorage.getItem('ghost_ai_key') || '';
    let apiUrl = localStorage.getItem('ghost_api_url') || 'https://api.openai.com/v1';
    let aiModel = localStorage.getItem('ghost_ai_model') || 'moonshotai/kimi-k2.5';
    let conversationHistory = JSON.parse(localStorage.getItem('ghost_chat_history') || '[]');
    let currentScreenshot = null;
    let liveMonitorActive = false;
    let protectionOn = true;
    let isLoading = false;

    const $ = (s) => document.querySelector(s);
    const $$ = (s) => document.querySelectorAll(s);

    // --- INIT ---
    invoke('get_platform').then(p => {
      $('#platform-label').textContent = p === 'windows' ? '🪟' : p === 'macos' ? '🍎' : '🐧';
    });

    // --- TITLEBAR ---
    $('#titlebar').onpointerdown = (e) => {
      // Don't drag if clicking a button
      if (e.target.closest('button')) return;
      appWindow.startDragging();
    };
    $('#btn-minimize').onclick = () => appWindow.minimize();
    $('#btn-close').onclick = () => appWindow.close();
    // --- TOOLBAR MODES ---
    let activeMode = 'explain';
    $$('.mode-btn').forEach(btn => {
      btn.onclick = () => {
        $$('.mode-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activeMode = btn.dataset.mode;
        console.log("Mode switched to:", activeMode);
      };
    });

    const langs = ['PY', 'JS', 'RS', 'TS', 'GO'];
    let langIdx = 0;
    $('#lang-btn').onclick = () => {
      langIdx = (langIdx + 1) % langs.length;
      $('#lang-btn').textContent = langs[langIdx];
      saveUserSettings();
    };

    $('#clear-btn').onclick = () => {
      if (confirm('Clear session?')) {
        conversationHistory = [];
        $('#chat-messages').innerHTML = '';
        saveHistory();
      }
    };

    // --- API CONFIG (persisted in localStorage + Supabase settings) ---
    const apiKeyInput = $('#api-key');
    const apiUrlInput = $('#api-url');
    const apiModelInput = $('#api-model');

    if (aiKey) apiKeyInput.value = aiKey;
    apiUrlInput.value = apiUrl;
    apiModelInput.value = aiModel;

    apiKeyInput.oninput = () => {
      aiKey = apiKeyInput.value.trim();
      saveUserSettings();
    };
    apiUrlInput.oninput = () => {
      apiUrl = apiUrlInput.value.trim();
      saveUserSettings();
    };
    apiModelInput.oninput = () => {
      aiModel = apiModelInput.value.trim();
      saveUserSettings();
    };

    $('#clear-key-btn').onclick = () => {
      aiKey = '';
      apiKeyInput.value = '';
      saveUserSettings();
    };

    // --- PANEL ---
    $('#tb-toggle').onclick = () => $('#controls-panel').classList.toggle('collapsed');

    // --- OPACITY ---
    const opacitySlider = $('#opacity-slider');
    opacitySlider.oninput = () => {
      const val = opacitySlider.value;
      $('#opacity-val').textContent = val + '%';
      $('#app-root').style.opacity = val / 100;
    };

    // --- PROTECTION ---
    $('#toggle-prot-btn').onclick = () => invoke('toggle_protection');
    listen('protection-status', (event) => {
      protectionOn = event.payload;
      const dot = $('#prot-dot');
      const text = $('#prot-status-text');
      const btn = $('#toggle-prot-btn');

      if (protectionOn) {
        dot.classList.remove('off');
        text.textContent = 'ON';
        btn.textContent = '🛡️ ON';
        btn.classList.remove('off');
      } else {
        dot.classList.add('off');
        text.textContent = 'OFF';
        btn.textContent = '⚠️ OFF';
        btn.classList.add('off');
      }
    });

    // --- CAPTURE ---
    $('#capture-btn').onclick = async () => {
      try {
        const base64 = await invoke('capture_screen');
        currentScreenshot = base64;
        $('#screenshot-img').src = base64;
        $('#screenshot-preview').classList.add('show');
      } catch (e) {
        showError(e);
      }
    };

    $('#live-btn').onclick = () => {
      liveMonitorActive = !liveMonitorActive;
      $('#live-btn').classList.toggle('live-active', liveMonitorActive);
      if (liveMonitorActive) {
        showError('Live Monitoring active (Auto-capture simulation)');
      }
    };

    const voiceBtn = $('#voice-btn');
    voiceBtn.onclick = () => {
      voiceBtn.classList.toggle('voice-active');
      if (voiceBtn.classList.contains('voice-active')) {
        showError('Voice mode ready (Shortcuts active)');
      }
    };
    $('#dismiss-screenshot').onclick = () => {
      currentScreenshot = null;
      $('#screenshot-preview').classList.remove('show');
    };

    listen('shortcut-capture', () => {
      $('#capture-btn').click();
    });
    listen('shortcut-hide', () => {
      const root = $('#app-root');
      const current = parseFloat(getComputedStyle(root).opacity);
      root.style.opacity = current < 0.1 ? 0.9 : 0.02; // Ghostly hide
    });

    // --- CHAT ---
    const problemInput = $('#problem-input');
    problemInput.oninput = () => {
      $('#char-count').textContent = problemInput.value.length;
      problemInput.style.height = 'auto';
      problemInput.style.height = Math.min(problemInput.scrollHeight, 100) + 'px';
    };

    $('#run-btn').onclick = runGhost;
    window.onkeydown = (e) => {
      if (e.ctrlKey && e.key === 'Enter') runGhost();
    };

    // --- MARKDOWN & SYNTAX HIGHLIGHTING ---
    const { marked, DOMPurify } = window;
    const renderer = new marked.Renderer();
    renderer.code = function(code, infostring, escaped) {
      let text = code;
      let lang = infostring;
      if (typeof code === 'object') {
        text = code.text;
        lang = code.lang;
      }
      const displayLang = (lang || 'code').toUpperCase();
      const highlighted = hljs.highlight(text, { language: hljs.getLanguage(lang) ? lang : 'plaintext' }).value;
      return `
        <div class="code-block-wrapper">
          <div class="code-block-header">
            <span class="code-block-lang">${displayLang}</span>
            <button class="code-block-copy">COPY</button>
          </div>
          <pre><code class="hljs language-${lang || 'plaintext'}">${highlighted}</code></pre>
        </div>
      `;
    };
    marked.use({ renderer });

    // Event delegation for code block copy buttons
    document.addEventListener('click', (e) => {
      if (e.target && e.target.classList.contains('code-block-copy')) {
        const btn = e.target;
        const wrapper = btn.closest('.code-block-wrapper');
        const codeEl = wrapper.querySelector('pre code');
        if (codeEl) {
          navigator.clipboard.writeText(codeEl.innerText).then(() => {
            btn.textContent = '✓';
            btn.classList.add('copied');
            setTimeout(() => {
              btn.textContent = 'COPY';
              btn.classList.remove('copied');
            }, 1000);
          });
        }
      }
    });

    async function runGhost() {
      const prompt = problemInput.value.trim();
      if (!prompt && !currentScreenshot) return;
      if (!aiKey) { showError('API Key Required'); return; }

      const lang = $('#lang-btn').textContent;
      const modePrompt = activeMode === 'explain' ? 'Explain the logic and concept behind this problem clearly.' :
        activeMode === 'hints' ? 'Give me subtle hints to solve this without giving the full code.' :
          'Provide a complete, optimized solution with code.';

      const msg = `[Language: ${lang}] [Mode: ${activeMode.toUpperCase()}] ${prompt || '[Screen Analysis]'}\n\nContext: ${modePrompt}`;

      addChatBubble('user', msg);
      conversationHistory.push({ role: 'user', content: msg });
      await saveMessageToCloud('user', msg);
      if (conversationHistory.length === 1) {
        await handleAutoTitle(prompt || '[Screen Analysis]');
      }

      problemInput.value = '';
      $('#char-count').textContent = '0';

      isLoading = true;
      $('#run-btn').disabled = true;
      $('#run-btn').innerHTML = '<span class="spinner"></span>';

      const assistantBubble = addChatBubble('assistant', 'Thinking...');

      try {
        const response = await invoke('process_ai_request', {
          prompt: msg,
          image: currentScreenshot,
          history: conversationHistory.slice(0, -1),
          apiKey: aiKey,
          apiUrl: apiUrl,
          model: aiModel
        });

        assistantBubble.textContent = '';
        await typewriter(response, assistantBubble);
        conversationHistory.push({ role: 'assistant', content: response });
        saveHistory();
        await saveMessageToCloud('assistant', response);
      } catch (e) {
        showError(e);
        assistantBubble.textContent = 'Error: ' + e;
      } finally {
        isLoading = false;
        $('#run-btn').disabled = false;
        $('#run-btn').textContent = '▶';
      }
    }

    function addChatBubble(role, text) {
      const div = document.createElement('div');
      div.className = `chat-msg ${role}`;
      div.innerHTML = `<div class="msg-label">${role === 'user' ? 'YOU' : 'GHOST'}</div><div class="msg-body"></div>`;
      $('#chat-messages').appendChild(div);
      $('#output').scrollTop = $('#output').scrollHeight;
      const body = div.querySelector('.msg-body');
      if (role === 'user') {
        body.textContent = text;
      } else {
        body.innerHTML = DOMPurify.sanitize(marked.parse(text));
      }
      return body;
    }

    async function typewriter(text, targetEl) {
      const el = targetEl;
      const chars = text.split('');
      let i = 0;
      let currentText = '';
      const speed = Math.max(1, Math.min(10, 2000 / chars.length));
      return new Promise(resolve => {
        function type() {
          if (i < chars.length) {
            const batch = Math.min(5, chars.length - i);
            for (let j = 0; j < batch; j++) currentText += chars[i + j];
            i += batch;
            el.innerHTML = DOMPurify.sanitize(marked.parse(currentText));
            $('#output').scrollTop = $('#output').scrollHeight;
            setTimeout(type, speed);
          } else {
            el.innerHTML = DOMPurify.sanitize(marked.parse(text));
            $('#output').scrollTop = $('#output').scrollHeight;
            resolve();
          }
        }
        type();
      });
    }

    function renderFullHistory() {
      $('#chat-messages').innerHTML = '';
      if (conversationHistory.length === 0) return;
      conversationHistory.forEach(msg => {
        if (msg.role === 'user' || msg.role === 'assistant') {
          addChatBubble(msg.role, msg.content);
        }
      });
      $('#output').scrollTop = $('#output').scrollHeight;
    }

    // Load history on startup
    renderFullHistory();

    function saveHistory() {
      localStorage.setItem('ghost_chat_history', JSON.stringify(conversationHistory.slice(-20)));
    }

    // ─── AUTH CONTROLLER ───
    let db = null;
    let currentUser = null;

    async function initSupabase() {
      try {
        const env = await invoke('get_env');
        const url = env.SUPABASE_URL || '';
        const key = env.SUPABASE_PUBLISHABLE_KEY || env.SUPABASE_ANON_KEY || '';

        if (!url || !key) {
          console.warn('[GHOST] Supabase credentials missing in .env');
          $('#auth-status-text').textContent = 'Offline Mode (No .env config)';
          return;
        }

        const { createClient } = supabase;
        db = createClient(url, key, {
          auth: {
            flowType: 'pkce',
            detectSessionInUrl: false, // handled via listener
            autoRefreshToken: true,
            persistSession: true
          }
        });

        // Listen for OAuth callback event from Tauri backend Rust TcpListener
        listen('oauth-callback', async (event) => {
          console.log('[GHOST] Received OAuth callback event from Rust TcpListener:', event);
          const { code, error } = event.payload;
          if (code) {
            $('#auth-status-text').textContent = 'Exchanging code for session...';
            try {
              const { data, error: exchangeError } = await db.auth.exchangeCodeForSession(code);
              if (exchangeError) throw exchangeError;
              console.log('[GHOST] OAuth code exchange successful');
            } catch (err) {
              console.error('[GHOST] OAuth code exchange failed:', err);
              showError('Authentication failed: ' + err.message);
              $('#auth-status-text').textContent = 'Authentication failed.';
            }
          } else if (error) {
            showError('OAuth Error: ' + error);
            $('#auth-status-text').textContent = 'Authentication error: ' + error;
          }
        });

        // Guard to only run session load once per login
        let sessionLoadedForUser = null;

        // Listen for auth state changes
        db.auth.onAuthStateChange(async (event, session) => {
          console.log('[GHOST] Auth state changed:', event, session?.user?.id);
          if (session) {
            const isSameUser = sessionLoadedForUser === session.user.id;
            currentUser = session.user;
            $('#auth-overlay').classList.add('hidden');
            $('#user-profile-header').style.display = 'flex';
            $('#user-avatar-img').src = currentUser.user_metadata?.avatar_url || 'https://www.gravatar.com/avatar/00000000000000000000000000000000?d=mp&f=y';
            $('#user-email-text').textContent = currentUser.email.split('@')[0];
            $('#account-status-label').textContent = `Cloud Sync: ${currentUser.email}`;

            if (!isSameUser) {
              sessionLoadedForUser = session.user.id;
              // Load and sync settings
              await loadUserSettings();
              // Load multi-chat sessions and start realtime updates
              await loadSessions();
              setupRealtimeSync();
            }
          } else {
            currentUser = null;
            sessionLoadedForUser = null;
            $('#auth-overlay').classList.remove('hidden');
            $('#user-profile-header').style.display = 'none';
            $('#account-status-label').textContent = 'Local Mode';
            $('#auth-status-text').textContent = 'Ready to Sign In';
          }
        });

      } catch (err) {
        console.error('[GHOST] Error initializing Supabase:', err);
        $('#auth-status-text').textContent = 'Offline Fallback (Connection error)';
      }
    }

    async function loadUserSettings() {
      if (!db || !currentUser) return;
      try {
        const { data, error } = await db
          .from('settings')
          .select('*')
          .single();

        if (error && error.code !== 'PGRST116') {
          throw error;
        }

        if (data) {
          if (data.api_key) {
            aiKey = data.api_key.trim();
            apiKeyInput.value = aiKey;
            localStorage.setItem('ghost_ai_key', aiKey);
          }
          if (data.api_url) {
            apiUrl = data.api_url.trim();
            apiUrlInput.value = apiUrl;
            localStorage.setItem('ghost_api_url', apiUrl);
          }
          if (data.ai_model) {
            aiModel = data.ai_model.trim();
            apiModelInput.value = aiModel;
            localStorage.setItem('ghost_ai_model', aiModel);
          }
          if (data.preferred_language) {
            const matchedIdx = langs.indexOf(data.preferred_language.toUpperCase().slice(0, 2));
            if (matchedIdx !== -1) {
              langIdx = matchedIdx;
              $('#lang-btn').textContent = langs[langIdx];
            }
          }
        } else {
          // Sync existing localStorage to cloud database
          await saveUserSettings();
        }
      } catch (err) {
        console.error('[GHOST] Failed to load settings:', err);
        showError('Cloud settings load failed: ' + err.message);
      }
    }

    async function saveUserSettings() {
      // Local storage fallback updated first
      localStorage.setItem('ghost_ai_key', aiKey);
      localStorage.setItem('ghost_api_url', apiUrl);
      localStorage.setItem('ghost_ai_model', aiModel);

      if (!db || !currentUser) return;
      try {
        const { error } = await db
          .from('settings')
          .upsert({
            user_id: currentUser.id,
            api_key: aiKey,
            api_url: apiUrl,
            ai_model: aiModel,
            preferred_language: $('#lang-btn').textContent,
            updated_at: new Date().toISOString()
          }, { onConflict: 'user_id' });

        if (error) throw error;
      } catch (err) {
        console.error('[GHOST] Cloud settings save failed:', err);
        showError('Cloud settings save failed: ' + err.message);
      }
    }

    // Google Login button action
    $('#btn-google-login').addEventListener('click', async () => {
      if (!db) {
        showError('Database client not initialized. Work offline or check your configuration.');
        return;
      }
      $('#auth-status-text').textContent = 'Opening browser...';
      try {
        const { data, error } = await db.auth.signInWithOAuth({
          provider: 'google',
          options: {
            redirectTo: 'http://localhost:1420/auth/callback',
            skipBrowserRedirect: true
          }
        });
        if (error) throw error;
        if (data && data.url) {
          await invoke('open_in_browser', { url: data.url });
        } else {
          throw new Error('No authentication URL returned from database.');
        }
      } catch (err) {
        console.error('[GHOST] OAuth initiation failed:', err);
        showError('Login failed: ' + err.message);
        $('#auth-status-text').textContent = 'Login failed.';
      }
    });

    // Work Offline button action
    $('#btn-work-offline').addEventListener('click', async () => {
      $('#auth-overlay').classList.add('hidden');
      $('#account-status-label').textContent = 'Offline Mode (Local)';
      await loadSessions();
    });

    // Sign Out button action
    $('#btn-signout').addEventListener('click', async () => {
      if (db) {
        try {
          await db.auth.signOut();
        } catch (err) {
          console.error('[GHOST] Sign out error:', err);
          showError('Sign out error: ' + err.message);
        }
      } else {
        $('#auth-overlay').classList.remove('hidden');
      }
    });

    // ─── CHAT SESSIONS & SIDEBAR SYSTEM ───
    let currentSession = null;
    let sessionsList = [];
    let realtimeChannel = null;

    // Toggle Sidebar Action
    $('#btn-sidebar-toggle').addEventListener('click', toggleSidebar);
    $('#sidebar-backdrop').addEventListener('click', closeSidebar);

    function toggleSidebar() {
      $('#sidebar').classList.toggle('open');
      $('#sidebar-backdrop').classList.toggle('show');
    }

    function closeSidebar() {
      $('#sidebar').classList.remove('open');
      $('#sidebar-backdrop').classList.remove('show');
    }

    // Scroll to Bottom Indicator Action
    const outputEl = $('#output');
    const scrollBottomBtn = $('#scroll-bottom-btn');
    outputEl.addEventListener('scroll', () => {
      const threshold = 150;
      const isAtBottom = outputEl.scrollHeight - outputEl.scrollTop - outputEl.clientHeight < threshold;
      if (isAtBottom) {
        scrollBottomBtn.classList.remove('show');
      } else {
        scrollBottomBtn.classList.add('show');
      }
    });
    scrollBottomBtn.addEventListener('click', () => {
      outputEl.scrollTop = outputEl.scrollHeight;
    });

    // Create New Session
    $('#btn-new-chat').addEventListener('click', createNewSession);

    async function createNewSession() {
      // Immediately clear the UI for a snappy feel
      conversationHistory = [];
      renderFullHistory();
      updateSessionInfo();
      closeSidebar();

      if (!db || !currentUser) {
        const offlineId = 'offline-' + Date.now();
        const newSess = { id: offlineId, title: 'New Chat', updated_at: new Date().toISOString() };
        sessionsList.unshift(newSess);
        currentSession = newSess;
        localStorage.setItem('ghost_chat_history', '[]');
        localStorage.setItem('ghost_offline_sessions', JSON.stringify(sessionsList));
        localStorage.setItem('ghost_current_session_id', offlineId);
        renderSidebarSessions();
        return;
      }
      
      try {
        const { data, error } = await db
          .from('sessions')
          .insert({
            user_id: currentUser.id,
            title: 'New Chat'
          })
          .select()
          .single();
          
        if (error) throw error;
        currentSession = data;
        localStorage.setItem('ghost_current_session_id', data.id);

        // Immediately add to sidebar list without waiting for server refresh
        sessionsList.unshift(data);
        renderSidebarSessions();

        // Silently sync full list in background without touching currentSession or messages
        db.from('sessions').select('*').order('updated_at', { ascending: false })
          .then(({ data: allSessions }) => {
            if (allSessions) {
              sessionsList = allSessions;
              renderSidebarSessions();
            }
          })
          .catch(e => console.warn('[GHOST] Background session sync error:', e));

      } catch (e) {
        console.error('[GHOST] Create session error:', e);
        showError('Failed to create new chat session: ' + e.message);
      }
    }

    async function loadSessions() {
      if (!db || !currentUser) {
        sessionsList = JSON.parse(localStorage.getItem('ghost_offline_sessions') || '[]');
        if (sessionsList.length === 0) {
          const defaultSess = { id: 'offline-default', title: 'New Chat', updated_at: new Date().toISOString() };
          sessionsList = [defaultSess];
          localStorage.setItem('ghost_offline_sessions', JSON.stringify(sessionsList));
        }
        const lastSessId = localStorage.getItem('ghost_current_session_id') || sessionsList[0].id;
        currentSession = sessionsList.find(s => s.id === lastSessId) || sessionsList[0];
        renderSidebarSessions();
        await loadSessionMessages(currentSession.id);
        return;
      }
      
      try {
        console.log('[GHOST] loadSessions: querying Supabase for user', currentUser.id);
        const { data, error } = await db
          .from('sessions')
          .select('*')
          .order('updated_at', { ascending: false });
          
        if (error) {
          console.error('[GHOST] loadSessions ERROR:', error);
          showError('Session load error: ' + error.message + ' (code: ' + error.code + ')');
          return;
        }
        
        console.log('[GHOST] loadSessions: got', data?.length, 'sessions:', JSON.stringify(data?.map(s => s.id)));
        sessionsList = data || [];

        if (sessionsList.length === 0) {
          console.log('[GHOST] loadSessions: no sessions found, creating new one');
          await createNewSession();
          return;
        }
        
        const lastSessionId = localStorage.getItem('ghost_current_session_id');
        currentSession = sessionsList.find(s => s.id === lastSessionId) || sessionsList[0];
        
        renderSidebarSessions();
        await loadSessionMessages(currentSession.id);
      } catch (e) {
        console.error('[GHOST] Load sessions exception:', e);
        showError('Load sessions exception: ' + e.message);
      }
    }

    async function loadSessionMessages(sessionId) {
      localStorage.setItem('ghost_current_session_id', sessionId);
      if (sessionId.startsWith('offline-')) {
        conversationHistory = JSON.parse(localStorage.getItem(`ghost_chat_history_${sessionId}`) || '[]');
        renderFullHistory();
        updateSessionInfo();
        return;
      }
      
      if (!db || !currentUser) return;
      try {
        const { data, error } = await db
          .from('messages')
          .select('*')
          .eq('session_id', sessionId)
          .order('created_at', { ascending: true });
          
        if (error) throw error;
        
        conversationHistory = (data || []).map(m => ({
          role: m.role,
          content: m.content
        }));
        
        renderFullHistory();
        updateSessionInfo();
      } catch (e) {
        console.error('[GHOST] Load messages error:', e);
        showError('Failed to load session messages: ' + e.message);
      }
    }

    async function deleteSession(id, event) {
      if (event) event.stopPropagation();
      if (!confirm('Are you sure you want to delete this chat session?')) return;
      
      if (id.startsWith('offline-')) {
        sessionsList = sessionsList.filter(s => s.id !== id);
        localStorage.setItem('ghost_offline_sessions', JSON.stringify(sessionsList));
        localStorage.removeItem(`ghost_chat_history_${id}`);
        if (currentSession && currentSession.id === id) {
          localStorage.removeItem('ghost_current_session_id');
        }
        await loadSessions();
        return;
      }
      
      if (!db) return;
      try {
        const { error } = await db
          .from('sessions')
          .delete()
          .eq('id', id);
          
        if (error) throw error;
        
        if (currentSession && currentSession.id === id) {
          localStorage.removeItem('ghost_current_session_id');
        }
        await loadSessions();
      } catch (e) {
        console.error('[GHOST] Delete session error:', e);
        showError('Failed to delete chat: ' + e.message);
      }
    }

    function formatRelativeDate(dateStr) {
      if (!dateStr) return '';
      const d = new Date(dateStr);
      const now = new Date();
      const diffMs = now - d;
      const diffMins = Math.floor(diffMs / (1000 * 60));
      if (diffMins < 1) return 'Just now';
      if (diffMins < 60) return `${diffMins}m ago`;
      const diffHours = Math.floor(diffMins / 60);
      if (diffHours < 24) return `${diffHours}h ago`;
      const diffDays = Math.floor(diffHours / 24);
      if (diffDays === 1) return 'Yesterday';
      if (diffDays < 7) return `${diffDays}d ago`;
      return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
    }

    function renderSidebarSessions() {
      const listContainer = $('#session-list');
      listContainer.innerHTML = '';
      
      sessionsList.forEach(session => {
        const activeClass = (currentSession && currentSession.id === session.id) ? 'active' : '';
        const dateText = formatRelativeDate(session.updated_at);
        
        const item = document.createElement('div');
        item.className = `session-item ${activeClass}`;
        item.onclick = () => {
          currentSession = session;
          renderSidebarSessions();
          loadSessionMessages(session.id);
          closeSidebar();
        };
        
        item.innerHTML = `
          <div class="session-info-left">
            <div class="session-title-text">${escapeHTML(session.title)}</div>
            <div class="session-date-text">${dateText}</div>
          </div>
          <button class="session-delete-btn" title="Delete chat">✕</button>
        `;
        
        item.querySelector('.session-delete-btn').onclick = (e) => deleteSession(session.id, e);
        listContainer.appendChild(item);
      });
    }

    async function saveMessageToCloud(role, content) {
      if (currentSession) {
        if (currentSession.id.startsWith('offline-')) {
          const historyKey = `ghost_chat_history_${currentSession.id}`;
          let offlineHist = JSON.parse(localStorage.getItem(historyKey) || '[]');
          offlineHist.push({ role, content });
          localStorage.setItem(historyKey, JSON.stringify(offlineHist));
          
          currentSession.updated_at = new Date().toISOString();
          const sessIndex = sessionsList.findIndex(s => s.id === currentSession.id);
          if (sessIndex !== -1) {
            sessionsList[sessIndex].updated_at = currentSession.updated_at;
            localStorage.setItem('ghost_offline_sessions', JSON.stringify(sessionsList));
          }
          renderSidebarSessions();
          return;
        }
        
        if (!db || !currentUser) return;
        try {
          const { error } = await db
            .from('messages')
            .insert({
              session_id: currentSession.id,
              user_id: currentUser.id,
              role,
              content
            });
            
          if (error) throw error;
          
          const now = new Date().toISOString();
          await db
            .from('sessions')
            .update({ updated_at: now })
            .eq('id', currentSession.id);
            
        } catch (err) {
          console.error('[GHOST] Error saving message to cloud:', err);
        }
      }
    }

    async function handleAutoTitle(firstMessageText) {
      if (currentSession && currentSession.title === 'New Chat') {
        const newTitle = firstMessageText.slice(0, 40) + (firstMessageText.length > 40 ? '...' : '');
        currentSession.title = newTitle;
        
        // Update sidebar immediately for instant feedback
        const sessIndex = sessionsList.findIndex(s => s.id === currentSession.id);
        if (sessIndex !== -1) sessionsList[sessIndex].title = newTitle;
        renderSidebarSessions();

        if (currentSession.id.startsWith('offline-')) {
          localStorage.setItem('ghost_offline_sessions', JSON.stringify(sessionsList));
          return;
        }
        
        if (!db) return;
        try {
          await db
            .from('sessions')
            .update({ title: newTitle })
            .eq('id', currentSession.id);
        } catch (err) {
          console.error('[GHOST] Auto title error:', err);
        }
      }
    }

    function setupRealtimeSync() {
      if (!db || !currentUser) return;
      if (realtimeChannel) {
        realtimeChannel.unsubscribe();
      }
      realtimeChannel = db.channel('sessions-channel')
        .on('postgres_changes', {
          event: '*',
          schema: 'public',
          table: 'sessions',
          filter: `user_id=eq.${currentUser.id}`
        }, () => {
          loadSessions();
        })
        .subscribe();
    }

    function escapeHTML(s) {
      if (!s) return '';
      return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    // Run Supabase initialization
    initSupabase();

    function showError(m) {
      const el = $('#error-msg');
      el.textContent = m;
      el.classList.add('show');
      setTimeout(() => el.classList.remove('show'), 5000);
    }
  </script>
</body>

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GHOST — AI Interview Copilot</title>
  <!-- Markdown & Syntax Highlighting -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
  <!-- Supabase Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #080a0e;
      --bg2: #0d1117;
      --neon: #00ff88;
      --cyan: #00c8ff;
      --red: #ff3366;
      --orange: #ff9f43;
      --dim: #3a4553;
      --text: #c9d1d9;
      --text-bright: #e6edf3;
      --border: #1a2233;
      --glass: rgba(13, 17, 23, 0.85);
      --radius: 8px;
      --font-mono: 'Consolas', 'Courier New', monospace;
      --font-ui: 'Segoe UI', 'Arial', sans-serif;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      background: transparent;
      font-family: var(--font-mono);
      color: var(--text);
      overflow: hidden;
      user-select: none;
    }

    #app-root {
      width: 100%;
      height: 100%;
      background: var(--bg);
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
      border: 1px solid var(--border);
    }

    #app-root::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(0, 255, 136, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 255, 136, 0.03) 1px, transparent 1px);
      background-size: 24px 24px;
      pointer-events: none;
      z-index: 0;
    }

    #app-root::after {
      content: '';
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(0deg, transparent 0px, transparent 3px, rgba(0, 0, 0, 0.04) 3px, rgba(0, 0, 0, 0.04) 6px);
      pointer-events: none;
      z-index: 9999;
    }

    /* ─── TITLEBAR ─── */
    #titlebar {
      -webkit-app-region: drag;
      height: 36px;
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px;
      position: relative;
      z-index: 10;
      flex-shrink: 0;
    }

    #titlebar .left {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    #titlebar .logo {
      font-size: 14px;
    }

    #titlebar .title {
      font-family: var(--font-ui);
      font-weight: 800;
      font-size: 11px;
      color: var(--neon);
      letter-spacing: 1.5px;
    }

    .stealth-badge {
      font-size: 7px;
      font-weight: 700;
      color: var(--bg);
      background: var(--neon);
      padding: 2px 5px;
      border-radius: 3px;
      animation: blink 1.4s ease-in-out infinite;
    }

    @keyframes blink {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0.3;
      }
    }

    .header-info {
      font-size: 8px;
      color: var(--dim);
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .prot-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--neon);
      box-shadow: 0 0 4px var(--neon);
      transition: all 0.3s;
    }

    .prot-dot.off {
      background: var(--red);
      box-shadow: 0 0 4px var(--red);
    }

    #titlebar .controls {
      display: flex;
      gap: 3px;
      -webkit-app-region: no-drag;
    }

    #titlebar .controls button {
      width: 24px;
      height: 24px;
      border: none;
      border-radius: 3px;
      background: rgba(255, 255, 255, 0.05);
      color: var(--dim);
      cursor: pointer;
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    #titlebar .controls button:hover {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-bright);
    }

    #titlebar .controls .close-btn:hover {
      background: var(--red);
      color: #fff;
    }

    /* ─── COMPACT TOOLBAR ─── */
    #toolbar {
      display: flex;
      align-items: center;
      gap: 2px;
      padding: 3px 8px;
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      z-index: 10;
      position: relative;
    }

    .tb-btn {
      width: 28px;
      height: 26px;
      border: none;
      border-radius: 4px;
      background: transparent;
      color: var(--dim);
      cursor: pointer;
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      gap: 2px;
    }

    .tb-btn:hover {
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-bright);
    }

    .tb-btn.tb-danger:hover {
      color: var(--red);
    }

    .tb-btn.live-active {
      background: rgba(255, 51, 102, 0.1);
      color: var(--red);
    }

    .tb-btn.voice-active {
      background: rgba(255, 51, 102, 0.1);
      color: var(--red);
    }

    .tb-sep {
      width: 1px;
      height: 16px;
      background: var(--border);
      margin: 0 3px;
      flex-shrink: 0;
    }

    #toolbar .mode-btn {
      width: 26px;
      height: 24px;
      border: 1px solid transparent;
      border-radius: 4px;
      background: transparent;
      color: var(--dim);
      cursor: pointer;
      font-size: 11px;
      transition: all 0.2s;
    }

    #toolbar .mode-btn:hover {
      border-color: var(--cyan);
      color: var(--cyan);
    }

    #toolbar .mode-btn.active {
      border-color: var(--cyan);
      color: var(--cyan);
      background: rgba(0, 200, 255, 0.08);
    }

    .tb-lang {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 3px;
      padding: 3px 4px;
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 8px;
      outline: none;
      cursor: pointer;
      -webkit-appearance: none;
      appearance: none;
    }

    .tb-lang option {
      background: var(--bg2);
    }

    #toolbar .model-toggle {
      display: flex;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border);
      border-radius: 3px;
      overflow: hidden;
    }

    #toolbar .model-toggle button {
      font-size: 10px;
      padding: 3px 6px;
      border: none;
      background: transparent;
      color: var(--dim);
      cursor: pointer;
      transition: all 0.2s;
    }

    #toolbar .model-toggle button.active {
      background: var(--neon);
      color: var(--bg);
    }

    #toolbar .session-info {
      font-size: 8px;
      color: var(--dim);
      margin-right: 2px;
    }

    #toolbar .pulse-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--red);
      display: none;
      animation: pulse 1s ease-in-out infinite;
    }

    .tb-btn.live-active .pulse-dot,
    .tb-btn.voice-active .pulse-dot {
      display: inline-block;
    }

    /* ─── COLLAPSIBLE PANEL ─── */
    #controls-panel {
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: max-height 0.25s ease, padding 0.25s ease, opacity 0.2s ease;
      max-height: 200px;
      overflow: hidden;
      flex-shrink: 0;
      z-index: 9;
    }

    #controls-panel.collapsed {
      max-height: 0;
      padding: 0 10px;
      opacity: 0;
      border-bottom: none;
    }

    .panel-section {
      display: block;
    }

    .panel-label {
      font-size: 7px;
      font-weight: 700;
      color: var(--cyan);
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 4px;
      display: block;
    }

    #controls-panel .api-row {
      display: flex;
      gap: 4px;
    }

    #controls-panel .api-row input {
      flex: 1;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--border);
      border-radius: 3px;
      padding: 5px 7px;
      color: var(--neon);
      font-family: var(--font-mono);
      font-size: 10px;
      outline: none;
    }

    #controls-panel .api-row input:focus {
      border-color: var(--neon);
    }

    #controls-panel .api-row input::placeholder {
      color: var(--dim);
    }

    #controls-panel .clear-btn {
      font-size: 9px;
      padding: 3px 6px;
      border: 1px solid var(--border);
      border-radius: 3px;
      background: transparent;
      color: var(--dim);
      cursor: pointer;
    }

    #controls-panel .clear-btn:hover {
      border-color: var(--red);
      color: var(--red);
    }

    /* ─── OVERLAYS (live feed, screenshot, transcript) ─── */
    .live-feed,
    .screenshot-preview,
    .transcript-area,
    .error-msg {
      margin: 0 8px;
      flex-shrink: 0;
    }

    .live-feed {
      display: none;
      border: 1px solid var(--border);
      border-radius: 4px;
      overflow: hidden;
      position: relative;
      height: 70px;
      margin-top: 4px;
    }

    .live-feed.show {
      display: block;
    }

    .live-feed img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.6;
    }

    .live-feed .feed-overlay {
      position: absolute;
      top: 3px;
      left: 5px;
      display: flex;
      gap: 4px;
      align-items: center;
    }

    .live-feed .feed-label {
      font-size: 7px;
      color: var(--red);
      background: rgba(0, 0, 0, 0.8);
      padding: 1px 4px;
      border-radius: 3px;
      display: flex;
      align-items: center;
      gap: 3px;
    }

    .live-feed .feed-label .dot {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--red);
      animation: pulse 1s ease-in-out infinite;
    }

    .live-feed .analyze-btn {
      font-family: var(--font-mono);
      font-size: 7px;
      padding: 1px 5px;
      border: 1px solid var(--orange);
      border-radius: 3px;
      background: rgba(0, 0, 0, 0.8);
      color: var(--orange);
      cursor: pointer;
    }

    .screenshot-preview {
      display: none;
      border: 1px solid var(--border);
      border-radius: 4px;
      overflow: hidden;
      position: relative;
      max-height: 70px;
      margin-top: 4px;
    }

    .screenshot-preview.show {
      display: block;
    }

    .screenshot-preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.7;
    }

    .screenshot-preview .overlay-label {
      position: absolute;
      top: 3px;
      left: 5px;
      font-size: 7px;
      color: var(--orange);
      background: rgba(0, 0, 0, 0.7);
      padding: 1px 4px;
      border-radius: 3px;
    }

    .screenshot-preview .dismiss-btn {
      position: absolute;
      top: 3px;
      right: 5px;
      font-size: 9px;
      color: var(--dim);
      background: rgba(0, 0, 0, 0.7);
      border: none;
      padding: 1px 4px;
      border-radius: 3px;
      cursor: pointer;
    }

    .transcript-area {
      display: none;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 6px 8px;
      font-size: 9px;
      color: var(--text);
      max-height: 60px;
      overflow-y: auto;
      margin-top: 4px;
    }

    .transcript-area.show {
      display: block;
    }

    .transcript-label {
      font-size: 6px;
      color: var(--red);
      letter-spacing: 1px;
      margin-bottom: 2px;
      display: flex;
      align-items: center;
      gap: 3px;
    }

    .transcript-label .live-dot {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--red);
      animation: pulse 1s ease-in-out infinite;
    }

    .error-msg {
      color: var(--red);
      font-size: 9px;
      padding: 5px 8px;
      border: 1px solid rgba(255, 51, 102, 0.3);
      border-radius: 4px;
      background: rgba(255, 51, 102, 0.05);
      display: none;
      margin-top: 4px;
    }

    .error-msg.show {
      display: block;
    }

    /* ─── CHAT OUTPUT (takes all remaining space) ─── */
    #output {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
      position: relative;
      z-index: 1;
      user-select: text;
      -webkit-user-select: text;
    }

    #output::-webkit-scrollbar {
      width: 4px;
    }

    #output::-webkit-scrollbar-track {
      background: transparent;
    }

    #output::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 3px;
    }

    #think-container {
      flex-shrink: 0;
      padding: 0 8px;
    }

    /* ─── BOTTOM INPUT BAR ─── */
    #input-bar {
      display: flex;
      align-items: flex-end;
      gap: 6px;
      padding: 6px 8px;
      background: var(--bg2);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
      z-index: 10;
      position: relative;
    }

    #input-bar textarea {
      flex: 1;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 7px 10px;
      color: var(--text-bright);
      font-family: var(--font-mono);
      font-size: 10px;
      line-height: 1.4;
      resize: none;
      outline: none;
      min-height: 32px;
      max-height: 100px;
      overflow-y: auto;
    }

    #input-bar textarea:focus {
      border-color: var(--cyan);
    }

    #input-bar textarea::placeholder {
      color: var(--dim);
    }

    #input-bar .char-count {
      position: absolute;
      right: 52px;
      bottom: 12px;
      font-size: 7px;
      color: var(--dim);
    }

    #input-bar .run-btn {
      width: 34px;
      height: 34px;
      border: none;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--neon), var(--cyan));
      color: var(--bg);
      cursor: pointer;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.25s;
      flex-shrink: 0;
    }

    #input-bar .run-btn:hover {
      box-shadow: 0 0 16px rgba(0, 255, 136, 0.3);
      transform: scale(1.05);
    }

    #input-bar .run-btn:active {
      transform: scale(0.95);
    }

    #input-bar .run-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    /* ─── CHAT BUBBLES ─── */
    .chat-msg {
      margin-bottom: 8px;
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 10px;
      line-height: 1.6;
      word-break: break-word;
      position: relative;
    }

    .chat-msg.user {
      background: rgba(0, 200, 255, 0.08);
      border: 1px solid rgba(0, 200, 255, 0.15);
      border-left: 3px solid var(--cyan);
      color: var(--cyan);
      white-space: pre-wrap;
    }

    .chat-msg.assistant {
      background: rgba(0, 255, 136, 0.04);
      border: 1px solid rgba(0, 255, 136, 0.1);
      border-left: 3px solid var(--neon);
      color: var(--text-bright);
    }

    .chat-msg.assistant p {
      margin-bottom: 8px;
    }

    .chat-msg.assistant p:last-child {
      margin-bottom: 0;
    }

    .chat-msg.assistant ul,
    .chat-msg.assistant ol {
      margin-bottom: 8px;
      padding-left: 16px;
    }

    .chat-msg.assistant li {
      margin-bottom: 4px;
    }

    .chat-msg.assistant strong {
      color: var(--text-bright);
      font-weight: 700;
    }

    .chat-msg.assistant h1,
    .chat-msg.assistant h2,
    .chat-msg.assistant h3,
    .chat-msg.assistant h4 {
      color: var(--cyan);
      margin: 12px 0 6px 0;
      font-size: 11px;
      font-weight: 700;
    }

    .chat-msg.assistant code {
      font-family: var(--font-mono);
      font-size: 9px;
      color: var(--neon);
      background: rgba(0, 255, 136, 0.08);
      padding: 1px 3px;
      border-radius: 3px;
    }

    /* Code Blocks */
    .code-block-wrapper {
      margin: 8px 0;
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
      background: rgba(0, 0, 0, 0.3);
    }

    .code-block-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 8px;
      background: rgba(255, 255, 255, 0.03);
      border-bottom: 1px solid var(--border);
    }

    .code-block-lang {
      font-size: 7px;
      font-weight: 700;
      color: var(--cyan);
      letter-spacing: 0.5px;
    }

    .code-block-copy {
      font-family: var(--font-mono);
      font-size: 7px;
      padding: 1px 5px;
      border: 1px solid var(--border);
      border-radius: 3px;
      background: rgba(0, 0, 0, 0.4);
      color: var(--dim);
      cursor: pointer;
      transition: all 0.2s;
    }

    .code-block-copy:hover {
      border-color: var(--cyan);
      color: var(--cyan);
    }

    .code-block-copy.copied {
      border-color: var(--neon);
      color: var(--neon);
    }

    .code-block-wrapper pre {
      margin: 0;
      padding: 8px;
      overflow-x: auto;
    }

    .code-block-wrapper pre code {
      background: transparent !important;
      padding: 0 !important;
      font-size: 9px;
      color: var(--text-bright);
      display: block;
    }

    .chat-msg .msg-label {
      font-size: 7px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 4px;
      opacity: 0.6;
    }

    .chat-msg.user .msg-label {
      color: var(--cyan);
    }

    .chat-msg.assistant .msg-label {
      color: var(--neon);
    }

    .chat-msg .msg-copy {
      position: absolute;
      top: 4px;
      right: 6px;
      font-family: var(--font-mono);
      font-size: 7px;
      padding: 1px 5px;
      border: 1px solid var(--border);
      border-radius: 3px;
      background: rgba(0, 0, 0, 0.4);
      color: var(--dim);
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.2s;
    }

    .chat-msg:hover .msg-copy {
      opacity: 1;
    }

    .chat-msg .msg-copy:hover {
      border-color: var(--neon);
      color: var(--neon);
    }

    /* ─── THINK BLOCK ─── */
    .think-block {
      margin-top: 6px;
      border: 1px solid var(--border);
      border-radius: 4px;
    }

    .think-block summary {
      padding: 5px 8px;
      font-size: 8px;
      color: var(--dim);
      cursor: pointer;
      background: rgba(0, 0, 0, 0.3);
      font-family: var(--font-mono);
    }

    .think-block .think-content {
      padding: 8px;
      font-size: 9px;
      color: var(--dim);
      line-height: 1.5;
      white-space: pre-wrap;
      font-family: var(--font-mono);
    }

    /* ─── STEALTH ─── */
    .opacity-control {
      display: flex;
      align-items: center;
      gap: 4px;
      flex: 1;
    }

    .opacity-slider {
      flex: 1;
      -webkit-appearance: none;
      appearance: none;
      height: 2px;
      background: var(--border);
      border-radius: 2px;
      outline: none;
    }

    .opacity-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--neon);
      cursor: pointer;
    }

    .opacity-val {
      font-size: 8px;
      color: var(--neon);
      min-width: 24px;
      text-align: right;
    }

    .toggle-prot-btn {
      font-family: var(--font-mono);
      font-size: 7px;
      padding: 3px 7px;
      border: 1px solid var(--neon);
      border-radius: 3px;
      background: transparent;
      color: var(--neon);
      cursor: pointer;
      white-space: nowrap;
    }

    .toggle-prot-btn.off {
      border-color: var(--red);
      color: var(--red);
    }

    .cursor-blink {
      display: inline-block;
      width: 6px;
      height: 12px;
      background: var(--neon);
      animation: cb 0.7s step-end infinite;
      vertical-align: text-bottom;
    }

    @keyframes cb {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0;
      }
    }

    .spinner {
      display: inline-block;
      width: 10px;
      height: 10px;
      border: 2px solid var(--bg);
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      vertical-align: middle;
      margin-right: 4px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* ─── AUTH SCREEN ─── */
    #auth-overlay {
      position: absolute;
      top: 36px;
      left: 0;
      right: 0;
      bottom: 0;

</head>

        <button id="btn-signout" class="toggle-prot-btn off" style="padding: 2px 6px;">🚪 Sign Out</button>
      </div>       <span class="opacity-val" id="opacity-val">100%</span>
        </div>
        <button class="toggle-prot-btn" id="toggle-prot-btn">🛡️ ON</button>

      </span>

      <div id="transcript-text">Listening...</div>

    <!-- ERROR -->

    <!-- CHAT HISTORY (takes all remaining space) -->

      <div id="chat-messages"></div>
      <button id="scroll-bottom-btn" title="Scroll to bottom">▼</button>
    </div>
    <div id="think-container"></div>

    <!-- BOTTOM INPUT BAR -->
    <div id="input-bar">
      <textarea id="problem-input" placeholder="Type problem or use 📸 🖥️ 🎤 ..." rows="1"></textarea>
      <span class="char-count" id="char-count">0</span>
      <button class="run-btn" id="run-btn" title="Ctrl+Enter">▶</button>

  <script>
    // ─── STATE ───
    let apiKey = localStorage.getItem('ghost_api_key') || '';
    let geminiKey = localStorage.getItem('ghost_gemini_key') || '';
    let currentModel = 'llama-3.3-70b-versatile';
    let currentMode = 'explain';
    let conversationHistory = JSON.parse(localStorage.getItem('ghost_chat_history') || '[]');
    let isLoading = false;
    let protectionOn = true;
    let isListening = false;
    let recognition = null;
    let liveMonitorActive = false;
    let lastFrameHash = '';
    let currentScreenshot = null;
    let latestLiveFrame = null;

    const $ = (s) => document.querySelector(s);
    const $$ = (s) => document.querySelectorAll(s);

    const apiKeyInput = $('#api-key');
    const problemInput = $('#problem-input');
    const charCount = $('#char-count');
    const langSelect = $('#lang-select');
    const runBtn = $('#run-btn');
    const output = $('#output');
    const chatMessages = $('#chat-messages');
    const errorMsg = $('#error-msg');
    const sessionInfo = $('#session-info');
    const clearBtn = $('#clear-btn');
    const opacitySlider = $('#opacity-slider');
    const opacityVal = $('#opacity-val');
    const toggleProtBtn = $('#toggle-prot-btn');
    const protDot = $('#prot-dot');
    const protStatusText = $('#prot-status-text');
    const platformLabel = $('#platform-label');
    const thinkContainer = $('#think-container');
    const captureBtn = $('#capture-btn');
    const liveBtn = $('#live-btn');
    const liveFeed = $('#live-feed');
    const liveImg = $('#live-img');
    const analyzeLiveBtn = $('#analyze-live-btn');
    const voiceBtn = $('#voice-btn');
    const transcriptArea = $('#transcript-area');
    const transcriptText = $('#transcript-text');
    const screenshotPreview = $('#screenshot-preview');
    const screenshotImg = $('#screenshot-img');
    const dismissScreenshot = $('#dismiss-screenshot');

    // ─── INIT ───
    const platform = window.ghostAPI?.platform || 'unknown';
    platformLabel.textContent = platform === 'win32' ? '🪟' : platform === 'darwin' ? '🍎' : '🐧';

    // ─── TITLEBAR ───
    $('#btn-minimize').addEventListener('click', () => window.ghostAPI?.minimizeWindow());
    $('#btn-close').addEventListener('click', () => window.ghostAPI?.closeWindow());

    // ─── CONTROLS PANEL TOGGLE ───
    const controlsPanel = $('#controls-panel');
    $('#tb-toggle').addEventListener('click', () => {
      controlsPanel.classList.toggle('collapsed');
    });

    // ─── AUTO-EXPAND TEXTAREA ───
    problemInput.addEventListener('input', () => {
      charCount.textContent = problemInput.value.length;
      problemInput.style.height = 'auto';
      problemInput.style.height = Math.min(problemInput.scrollHeight, 100) + 'px';
    });

    // ─── API KEY (persisted in localStorage + Supabase settings) ───
    if (apiKey) {
      apiKeyInput.value = apiKey;
    }
    apiKeyInput.addEventListener('input', () => {
      apiKey = apiKeyInput.value.trim();
      saveUserSettings();
    });
    $('#clear-key-btn').addEventListener('click', () => {
      apiKey = '';
      apiKeyInput.value = '';
      saveUserSettings();
    });

    // ─── GEMINI KEY (persisted in localStorage + Supabase settings) ───
    const geminiKeyInput = $('#gemini-key');
    if (geminiKey) geminiKeyInput.value = geminiKey;
    geminiKeyInput.addEventListener('input', () => {
      geminiKey = geminiKeyInput.value.trim();
      saveUserSettings();
    });
    $('#clear-gemini-btn').addEventListener('click', () => {
      geminiKey = '';
      geminiKeyInput.value = '';
      saveUserSettings();
    });

    // ─── MODEL TOGGLE ───
    $('#mode-fast').addEventListener('click', () => setModel('fast'));
    $('#mode-reason').addEventListener('click', () => setModel('reason'));

    function setModel(mode) {
      if (mode === 'fast') {
        currentModel = 'llama-3.3-70b-versatile';
        $('#mode-fast').classList.add('active');
        $('#mode-reason').classList.remove('active');
      } else {
        currentModel = 'qwen-qwq-32b';
        $('#mode-reason').classList.add('active');
        $('#mode-fast').classList.remove('active');
      }
    }

    // ─── MODE BUTTONS ───
    $$('.mode-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        $$('.mode-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentMode = btn.dataset.mode;
      });
    });

    // ─── CHAR COUNT ───
    problemInput.addEventListener('input', () => { charCount.textContent = problemInput.value.length; });

    // ══════════════════════════════════════════════
    //   SINGLE SCREENSHOT
    // ══════════════════════════════════════════════

    captureBtn.addEventListener('click', doScreenCapture);

    async function doScreenCapture() {
      captureBtn.textContent = '⏳...';
      captureBtn.disabled = true;
      try {
        const dataUrl = await window.ghostAPI.captureScreen();
        if (dataUrl) {
          currentScreenshot = dataUrl;
          screenshotImg.src = dataUrl;
          screenshotPreview.classList.add('show');
          // Don't auto-analyze — let user add a prompt in the input bar
        } else {
          showError('⚠️ Capture failed.');
        }
      } catch (err) {
        showError('⚠️ ' + err.message);
      } finally {
        captureBtn.textContent = '📸';
        captureBtn.disabled = false;
      }
    }

    window.ghostAPI?.onScreenCaptured((dataUrl) => {
      currentScreenshot = dataUrl;
      screenshotImg.src = dataUrl;
      screenshotPreview.classList.add('show');
      // Don't auto-analyze — let user type a prompt first
    });

    dismissScreenshot.addEventListener('click', () => {
      screenshotPreview.classList.remove('show');
      currentScreenshot = null;
    });

    // ══════════════════════════════════════════════
    //   LIVE SCREEN MONITOR
    // ══════════════════════════════════════════════

    liveBtn.addEventListener('click', toggleLiveMonitor);

    function toggleLiveMonitor() {
      if (liveMonitorActive) {
        stopLiveMonitor();
      } else {
        startLiveMonitor();
      }
    }

    function startLiveMonitor() {
      liveMonitorActive = true;
      liveBtn.classList.add('live-active');
      liveBtn.innerHTML = '<span class="pulse-dot"></span>🖥️';
      liveFeed.classList.add('show');
      lastFrameHash = '';
      window.ghostAPI?.startLiveMonitor(3000); // capture every 3 seconds
    }

    function stopLiveMonitor() {
      liveMonitorActive = false;
      liveBtn.classList.remove('live-active');
      liveBtn.innerHTML = '<span class="pulse-dot"></span>🖥️';
      liveFeed.classList.remove('show');
      latestLiveFrame = null;
      lastFrameHash = '';
      lastAnalyzedHash = '';
      clearTimeout(changeDebounce);
      window.ghostAPI?.stopLiveMonitor();
    }

    // Receive live frames and auto-analyze on change
    let changeDebounce = null;
    let lastAnalyzedHash = '';

    window.ghostAPI?.onLiveFrame((dataUrl) => {
      if (!liveMonitorActive) return;
      latestLiveFrame = dataUrl;
      liveImg.src = dataUrl;

      // Detect significant change: compare data length (rough proxy for content)
      const frameHash = dataUrl.length.toString();
      if (frameHash !== lastFrameHash) {
        lastFrameHash = frameHash;

        // Only auto-analyze if content actually changed significantly from last analysis
        const lengthDiff = Math.abs(parseInt(frameHash) - parseInt(lastAnalyzedHash || '0'));
        const threshold = parseInt(lastAnalyzedHash || '0') * 0.03; // 3% change

        if (lengthDiff > threshold && apiKey && !isLoading) {
          // Debounce: wait 2s for content to stabilize before analyzing
          clearTimeout(changeDebounce);
          changeDebounce = setTimeout(() => {
            if (latestLiveFrame && !isLoading && liveMonitorActive) {
              lastAnalyzedHash = latestLiveFrame.length.toString();
              analyzeImage(latestLiveFrame);
            }
          }, 2000);
        }
      }
    });

    // Analyze current live frame on demand (skip debounce)
    analyzeLiveBtn.addEventListener('click', () => {
      if (latestLiveFrame && apiKey) {
        clearTimeout(changeDebounce);
        lastAnalyzedHash = latestLiveFrame.length.toString();
        analyzeImage(latestLiveFrame);

      const assistantBody = addChatBubble('assistant', '', true);

      // Smart prompt: if user gave a specific question, focus on that

      let textPrompt;
      if (userPrompt) {
        textPrompt = `You are a smart AI assistant. The user is sharing their screen and asking:\n\n"${userPrompt}"\n\nAnalyze the screenshot and answer ONLY what the user asked about. Be direct, concise, and relevant. If code is visible, detect the language and mention it. Do not describe everything on screen — focus on the user's question.`;

        const modePrompts = {
          explain: langDetect + `Look at this screenshot and identify the MAIN problem or question shown. Focus only on what's important — ignore navigation bars, ads, irrelevant UI. Explain:\n\n**PROBLEM** — What is being asked\n**KEY CONSTRAINTS** — Important limits\n**APPROACH** — How to solve it, no code`,
          hints: langDetect + `Identify the main coding problem on screen. Give 3-5 progressive hints:\n**HINT 1** — General direction\n**HINT 2** — More specific\n**HINT 3** — Key insight\n**HINT 4** — Almost there\n**HINT 5** — Final nudge\nNO code.`,
          solution: langDetect + `Identify the main coding problem on screen. Write a clean, complete solution in the detected language with comments.\n\n**Time Complexity:** O(...)\n**Space Complexity:** O(...)`

          content = content.replace(/\[DETECTED LANGUAGE:.*?\]\n?/i, '').trim();

        const thinkMatch = content.match(/<think>([\s\S]*?)<\/think>/);

    async function callGroqVision(messages, model) {
      const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${apiKey}`
        },
        body: JSON.stringify({ model, messages, temperature: 0.6, max_tokens: 4096 })
      });
      if (!res.ok) {
        const errData = await res.json().catch(() => ({}));
        throw new Error(`API ${res.status}: ${errData.error?.message || res.statusText}`);
      }
      const data = await res.json();
      return data.choices[0].message.content;
    }

    // ─── GEMINI VISION API ───
    async function callGeminiVision(imageDataUrl, textPrompt) {
      const base64Match = imageDataUrl.match(/^data:image\/(\w+);base64,(.+)$/);
      if (!base64Match) throw new Error('Invalid image data');
      const mimeType = `image/${base64Match[1]}`;
      const base64Data = base64Match[2];

      const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${geminiKey}`;
      const res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          contents: [{
            parts: [
              { text: textPrompt },
              { inline_data: { mime_type: mimeType, data: base64Data } }
            ]
          }],
          generationConfig: { temperature: 0.4, maxOutputTokens: 4096 }
        })
      });
      if (!res.ok) {
        const errData = await res.json().catch(() => ({}));
        throw new Error(`Gemini ${res.status}: ${errData.error?.message || res.statusText}`);
      }
      const data = await res.json();
      return data.candidates?.[0]?.content?.parts?.[0]?.text || 'No response from Gemini.';
    }

    function startListening() {
      if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
        showError('⚠️ Speech recognition not available.');
        return;
      }

      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SR();
      recognition.continuous = true;
      recognition.interimResults = true;
      recognition.lang = 'en-US';

      let finalTranscript = '';
      let silenceTimer = null;

      recognition.onstart = () => {
        isListening = true;
        voiceBtn.classList.add('voice-active');
        voiceBtn.innerHTML = '<span class="pulse-dot"></span>🎤';
        transcriptArea.classList.add('show');
        transcriptText.textContent = 'Listening...';
        finalTranscript = '';
      };

      recognition.onresult = (event) => {
        let interim = '';
        for (let i = event.resultIndex; i < event.results.length; i++) {
          const t = event.results[i][0].transcript;
          if (event.results[i].isFinal) finalTranscript += t + ' ';
          else interim += t;
        }
        transcriptText.textContent = finalTranscript + interim;
        problemInput.value = (finalTranscript + interim).trim();
        charCount.textContent = problemInput.value.length;

        clearTimeout(silenceTimer);
        silenceTimer = setTimeout(() => {
          if (finalTranscript.trim().length > 0) stopListening();
        }, 3000);
      };

      recognition.onerror = (event) => {
        if (event.error === 'no-speech') return;
        if (event.error === 'not-allowed') showError('⚠️ Microphone access denied.');
        stopListening();
      };

      recognition.onend = () => {
        if (isListening) {
          try { recognition.start(); } catch (e) { stopListening(); }
        }
      };

      try { recognition.start(); } catch (e) {
        showError('⚠️ ' + e.message);
      }
    }

    function stopListening() {
      isListening = false;
      voiceBtn.classList.remove('voice-active');
      voiceBtn.innerHTML = '<span class="pulse-dot"></span>🎤';
      if (recognition) { try { recognition.stop(); } catch (e) { } recognition = null; }
      if (!transcriptText.textContent || transcriptText.textContent === 'Listening...') {

    async function typewriter(text, targetEl) {
      const el = targetEl;
      const chars = text.split('');
      let i = 0;
      let currentText = '';
      const speed = Math.max(1, Math.min(10, 2000 / chars.length));
      return new Promise(resolve => {
        function type() {
          if (i < chars.length) {
            const batch = Math.min(5, chars.length - i);
            for (let j = 0; j < batch; j++) currentText += chars[i + j];
            i += batch;
            el.innerHTML = DOMPurify.sanitize(marked.parse(currentText));
            output.scrollTop = output.scrollHeight;
            setTimeout(type, speed);
          } else {
            el.innerHTML = DOMPurify.sanitize(marked.parse(text));
            output.scrollTop = output.scrollHeight;
            resolve();
          }
        }
        type();
      });
    }

        }
      }

    async function initSupabase() {
      try {
        const env = await window.ghostAPI.getEnv();
        const url = env.SUPABASE_URL || '';
        const key = env.SUPABASE_PUBLISHABLE_KEY || env.SUPABASE_ANON_KEY || '';

        if (!url || !key) {
          console.warn('[GHOST] Supabase credentials missing in .env');
          $('#auth-status-text').textContent = 'Offline Mode (No .env config)';
          return;
        }

        const { createClient } = supabase;
        db = createClient(url, key, {
          auth: {
            flowType: 'pkce',
            detectSessionInUrl: false, // handled manually via IPC callback
            autoRefreshToken: true,
            persistSession: true
          }
        });

        // Handle OAuth callback event from Electron Main Process
        window.ghostAPI.onOauthCallback(async ({ code, error }) => {
          if (code) {
            $('#auth-status-text').textContent = 'Exchanging code for session...';
            try {
              const { data, error: exchangeError } = await db.auth.exchangeCodeForSession(code);
              if (exchangeError) throw exchangeError;
              console.log('[GHOST] OAuth code exchange successful');
            } catch (err) {
              console.error('[GHOST] OAuth code exchange failed:', err);
              showError('Authentication failed: ' + err.message);
              $('#auth-status-text').textContent = 'Authentication failed.';
            }
          } else if (error) {
            showError('OAuth Error: ' + error);
            $('#auth-status-text').textContent = 'Authentication error: ' + error;
          }
        });

        // Listen for auth state changes
        db.auth.onAuthStateChange(async (event, session) => {
          console.log('[GHOST] Auth state changed:', event, session);
          if (session) {
            currentUser = session.user;
            $('#auth-overlay').classList.add('hidden');
            $('#user-profile-header').style.display = 'flex';
            $('#user-avatar-img').src = currentUser.user_metadata?.avatar_url || 'https://www.gravatar.com/avatar/00000000000000000000000000000000?d=mp&f=y';
            $('#user-email-text').textContent = currentUser.email.split('@')[0];

            // Load and sync settings

            setupRealtimeSync();
          } else {
            currentUser = null;
            $('#auth-overlay').classList.remove('hidden');
            $('#user-profile-header').style.display = 'none';
            $('#account-status-label').textContent = 'Local Mode';
            $('#auth-status-text').textContent = 'Ready to Sign In';
          }
        });

      } catch (err) {
        console.error('[GHOST] Error initializing Supabase:', err);
        $('#auth-status-text').textContent = 'Offline Fallback (Connection error)';
      }
    }

    }

    // Google Login button action
    $('#btn-google-login').addEventListener('click', async () => {
      if (!db) {
        showError('Database client not initialized. Work offline or configure your .env file.');
        return;
      }
      $('#auth-status-text').textContent = 'Opening browser...';
      try {
        const { data, error } = await db.auth.signInWithOAuth({
          provider: 'google',
          options: {
            redirectTo: 'http://localhost:9999/auth/callback',
            skipBrowserRedirect: true
          }
        });
        if (error) throw error;
        if (data && data.url) {
          window.ghostAPI.openExternalUrl(data.url);
        } else {
          throw new Error('No authentication URL returned from database.');
        }
      } catch (err) {
        console.error('[GHOST] OAuth initiation failed:', err);
        showError('Login failed: ' + err.message);
        $('#auth-status-text').textContent = 'Login failed.';
      }
    });

    // Work Offline button action
    $('#btn-work-offline').addEventListener('click', async () => {
      $('#auth-overlay').classList.add('hidden');
      $('#account-status-label').textContent = 'Offline Mode (Local)';
      await loadSessions();
    });

    // Sign Out button action
    $('#btn-signout').addEventListener('click', async () => {
      if (db) {
        try {
          await db.auth.signOut();
        } catch (err) {
          console.error('[GHOST] Sign out error:', err);
          showError('Sign out error: ' + err.message);
        }
      } else {
        $('#auth-overlay').classList.remove('hidden');
      }
    });

    // Add listener for language preference change
    langSelect.addEventListener('change', () => {
      saveUserSettings();
    });

    // ─── CHAT SESSIONS & SIDEBAR SYSTEM ───
    let currentSession = null;
    let sessionsList = [];
    let realtimeChannel = null;

    // Toggle Sidebar Action
    $('#btn-sidebar-toggle').addEventListener('click', toggleSidebar);
    $('#sidebar-backdrop').addEventListener('click', closeSidebar);

    function toggleSidebar() {
      $('#sidebar').classList.toggle('open');
      $('#sidebar-backdrop').classList.toggle('show');
    }

    function closeSidebar() {
      $('#sidebar').classList.remove('open');
      $('#sidebar-backdrop').classList.remove('show');
    }

    // Scroll to Bottom Indicator Action
    const outputEl = $('#output');
    const scrollBottomBtn = $('#scroll-bottom-btn');
    outputEl.addEventListener('scroll', () => {
      const threshold = 150;
      const isAtBottom = outputEl.scrollHeight - outputEl.scrollTop - outputEl.clientHeight < threshold;
      if (isAtBottom) {
        scrollBottomBtn.classList.remove('show');
      } else {
        scrollBottomBtn.classList.add('show');
      }
    });
    scrollBottomBtn.addEventListener('click', () => {
      outputEl.scrollTop = outputEl.scrollHeight;
    });

    // Create New Session
    $('#btn-new-chat').addEventListener('click', createNewSession);

    async function createNewSession() {
      // Immediately clear the UI for a snappy feel
      conversationHistory = [];
      renderFullHistory();
      updateSessionInfo();
      closeSidebar();

      if (!db || !currentUser) {
        const offlineId = 'offline-' + Date.now();
        const newSess = { id: offlineId, title: 'New Chat', updated_at: new Date().toISOString() };
        sessionsList.unshift(newSess);
        currentSession = newSess;
        localStorage.setItem('ghost_chat_history', '[]');
        localStorage.setItem('ghost_offline_sessions', JSON.stringify(sessionsList));
        localStorage.setItem('ghost_current_session_id', offlineId);
        renderSidebarSessions();
        return;
      }
      
      try {
        const { data, error } = await db
          .from('sessions')
          .insert({
            user_id: currentUser.id,
            title: 'New Chat'
          })
          .select()
          .single();
          
        if (error) throw error;
        currentSession = data;
        localStorage.setItem('ghost_current_session_id', data.id);
        // Refresh sidebar list in background
        loadSessions().catch(e => console.warn('[GHOST] Session refresh error:', e));
      } catch (e) {
        console.error('[GHOST] Create session error:', e);
        showError('Failed to create new chat session: ' + e.message);
      }
    }

    async function loadSessions() {
      if (!db || !currentUser) {
        sessionsList = JSON.parse(localStorage.getItem('ghost_offline_sessions') || '[]');
        if (sessionsList.length === 0) {
          const defaultSess = { id: 'offline-default', title: 'New Chat', updated_at: new Date().toISOString() };
          sessionsList = [defaultSess];
          localStorage.setItem('ghost_offline_sessions', JSON.stringify(sessionsList));
        }
        const lastSessId = localStorage.getItem('ghost_current_session_id') || sessionsList[0].id;
        currentSession = sessionsList.find(s => s.id === lastSessId) || sessionsList[0];
        renderSidebarSessions();
        await loadSessionMessages(currentSession.id);
        return;
      }
      
      try {
        const { data, error } = await db
          .from('sessions')
          .select('*')
          .order('updated_at', { ascending: false });
          
        if (error) throw error;
        
        sessionsList = data || [];
        if (sessionsList.length === 0) {
          await createNewSession();
          return;
        }
        
        const lastSessionId = localStorage.getItem('ghost_current_session_id');
        currentSession = sessionsList.find(s => s.id === lastSessionId) || sessionsList[0];
        
        renderSidebarSessions();
        await loadSessionMessages(currentSession.id);
      } catch (e) {
        console.error('[GHOST] Load sessions error:', e);
        showError('Load sessions error: ' + e.message);
      }
    }

    async function loadSessionMessages(sessionId) {
      localStorage.setItem('ghost_current_session_id', sessionId);
      if (sessionId.startsWith('offline-')) {
        conversationHistory = JSON.parse(localStorage.getItem(`ghost_chat_history_${sessionId}`) || '[]');
        renderFullHistory();
        updateSessionInfo();
        return;
      }
      
      if (!db || !currentUser) return;
      try {
        const { data, error } = await db
          .from('messages')
          .select('*')
          .eq('session_id', sessionId)
          .order('created_at', { ascending: true });
          
        if (error) throw error;
        
        conversationHistory = (data || []).map(m => ({
          role: m.role,
          content: m.content
        }));
        
        renderFullHistory();
        updateSessionInfo();
      } catch (e) {
        console.error('[GHOST] Load messages error:', e);
        showError('Failed to load session messages: ' + e.message);
      }
    }

    async function deleteSession(id, event) {
      if (event) event.stopPropagation();
      if (!confirm('Are you sure you want to delete this chat session?')) return;
      
      if (id.startsWith('offline-')) {
        sessionsList = sessionsList.filter(s => s.id !== id);
        localStorage.setItem('ghost_offline_sessions', JSON.stringify(sessionsList));
        localStorage.removeItem(`ghost_chat_history_${id}`);
        if (currentSession && currentSession.id === id) {
          localStorage.removeItem('ghost_current_session_id');
        }
        await loadSessions();
        return;
      }
      
      if (!db) return;
      try {
        const { error } = await db
          .from('sessions')
          .delete()
          .eq('id', id);
          
        if (error) throw error;
        
        if (currentSession && currentSession.id === id) {
          localStorage.removeItem('ghost_current_session_id');
        }
        await loadSessions();
      } catch (e) {
        console.error('[GHOST] Delete session error:', e);
        showError('Failed to delete chat: ' + e.message);
      }
    }

    function formatRelativeDate(dateStr) {
      if (!dateStr) return '';
      const d = new Date(dateStr);
      const now = new Date();
      const diffMs = now - d;
      const diffMins = Math.floor(diffMs / (1000 * 60));
      if (diffMins < 1) return 'Just now';
      if (diffMins < 60) return `${diffMins}m ago`;
      const diffHours = Math.floor(diffMins / 60);
      if (diffHours < 24) return `${diffHours}h ago`;
      const diffDays = Math.floor(diffHours / 24);
      if (diffDays === 1) return 'Yesterday';
      if (diffDays < 7) return `${diffDays}d ago`;
      return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
    }

    function renderSidebarSessions() {
      const listContainer = $('#session-list');
      listContainer.innerHTML = '';
      
      sessionsList.forEach(session => {
        const activeClass = (currentSession && currentSession.id === session.id) ? 'active' : '';
        const dateText = formatRelativeDate(session.updated_at);
        
        const item = document.createElement('div');
        item.className = `session-item ${activeClass}`;
        item.onclick = () => {
          currentSession = session;
          renderSidebarSessions();
          loadSessionMessages(session.id);
          closeSidebar();
        };
        
        item.innerHTML = `
          <div class="session-info-left">
            <div class="session-title-text">${escapeHTML(session.title)}</div>
            <div class="session-date-text">${dateText}</div>
          </div>
          <button class="session-delete-btn" title="Delete chat">✕</button>
        `;
        
        item.querySelector('.session-delete-btn').onclick = (e) => deleteSession(session.id, e);
        listContainer.appendChild(item);
      });
    }

    async function saveMessageToCloud(role, content) {
      if (currentSession) {
        if (currentSession.id.startsWith('offline-')) {
          const historyKey = `ghost_chat_history_${currentSession.id}`;
          let offlineHist = JSON.parse(localStorage.getItem(historyKey) || '[]');
          offlineHist.push({ role, content });
          localStorage.setItem(historyKey, JSON.stringify(offlineHist));
          
          currentSession.updated_at = new Date().toISOString();
          const sessIndex = sessionsList.findIndex(s => s.id === currentSession.id);
          if (sessIndex !== -1) {
            sessionsList[sessIndex].updated_at = currentSession.updated_at;
            localStorage.setItem('ghost_offline_sessions', JSON.stringify(sessionsList));
          }
          renderSidebarSessions();
          return;
        }
        
        if (!db || !currentUser) return;
        try {
          const { error } = await db
            .from('messages')
            .insert({
              session_id: currentSession.id,
              user_id: currentUser.id,
              role,
              content
            });
            
          if (error) throw error;
          
          const now = new Date().toISOString();
          await db
            .from('sessions')
            .update({ updated_at: now })
            .eq('id', currentSession.id);
            
        } catch (err) {
          console.error('[GHOST] Error saving message to cloud:', err);
        }
      }
    }

    async function handleAutoTitle(firstMessageText) {
      if (currentSession && currentSession.title === 'New Chat') {
        const newTitle = firstMessageText.slice(0, 40) + (firstMessageText.length > 40 ? '...' : '');
        currentSession.title = newTitle;
        
        if (currentSession.id.startsWith('offline-')) {
          const sessIndex = sessionsList.findIndex(s => s.id === currentSession.id);
          if (sessIndex !== -1) {
            sessionsList[sessIndex].title = newTitle;
            localStorage.setItem('ghost_offline_sessions', JSON.stringify(sessionsList));
          }
          renderSidebarSessions();
          return;
        }
        
        if (!db) return;
        try {
          await db
            .from('sessions')
            .update({ title: newTitle })
            .eq('id', currentSession.id);
        } catch (err) {
          console.error('[GHOST] Auto title error:', err);
        }
      }
    }

    function setupRealtimeSync() {
      if (!db || !currentUser) return;
      if (realtimeChannel) {
        realtimeChannel.unsubscribe();
      }
      realtimeChannel = db.channel('sessions-channel')
        .on('postgres_changes', {
          event: '*',
          schema: 'public',
          table: 'sessions',
          filter: `user_id=eq.${currentUser.id}`
        }, () => {
          loadSessions();
        })
        .subscribe();
    }

    // Run Supabase initialization
    initSupabase();

    // ─── HELPERS ───
    function showError(msg) { errorMsg.textContent = msg; errorMsg.classList.add('show'); }
    function hideError() { errorMsg.classList.remove('show'); }
    function escapeHTML(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
    function delay(ms) { return new Promise(r => setTimeout(r, ms)); }
  </script>
</body>

</html>
